# What dot-files needs to know about Tablet. Its README is built from this
# file (docs/bar/build.py in NathanielInman/dotfiles reads it beside the
# hero), so a change here reaches that README on its next build.

name = "Tablet"
repo = "https://github.com/NathanielInman/tablet"
language = "Rust"
# Its module in packages/waybar/.config/waybar/config.jsonc.
module = "custom/tablet"
# "Tablet for <purpose>" in the README's list of the suite.
purpose = "the work VPN"
# The "In the bar" cell of the suite table.
lamp = "Frost only while the VPN's probes answer through it"
# Scripts and programs it replaced. dot-files' build fails if a doc still
# mentions one outside a sentence that says it was replaced.
retired = [
  "vpn.sh",
]
# Where it builds and is checked today: the pre-push hook and CI hold it to
# this list. The suite targets Linux, Windows and macOS; a port moves a
# platform here from `planned`.
platforms = ["linux"]
planned = ["windows", "macos"]
# Its stow package in dot-files, or "" when it needs none.
stow = "tablet"
# Install from a clean Arch machine, run in order.
install = [
  "sudo pacman -S --needed gtk4 gtk4-layer-shell",
  "git clone https://github.com/NathanielInman/tablet.git ~/Sites/tablet",
  "cd ~/Sites/tablet && cargo build --release",
  "install -Dm755 target/release/tablet target/release/tablet-board -t ~/.local/bin/",
  "sudo install -Dm644 packaging/polkit/50-tablet.rules /etc/polkit-1/rules.d/50-tablet.rules",
]
# Run after installing (and stowing) to check the setup.
check = [
  "tablet doctor",
]
